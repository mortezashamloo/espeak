# Put this file in your repo as .github/workflows/build.yml, and upload
# espeak-1.48.15-with-windows.zip to the repo root (no need to unpack it).
name: Build espeak (DLL + SAPI5 + installer)

on:
  workflow_dispatch:

jobs:
  # SAPI5 engine, built with Visual C++ on a Windows runner.
  # If it fails, the installer is still built (without SAPI5).
  sapi:
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the zip
        shell: pwsh
        run: Expand-Archive -Path espeak-1.48.15-with-windows.zip -DestinationPath espeak

      - name: Build espeak_sapi.dll (${{ matrix.arch }})
        shell: cmd
        working-directory: espeak
        run: python tools\sapi\build_sapi.py --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: sapi-${{ matrix.arch }}
          path: espeak/build-out/sapi/espeak_sapi-${{ matrix.arch }}.dll

  # DLL, command-line tool, dictionaries and installer (MinGW-w64 + NSIS on Linux)
  installer:
    needs: sapi
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the zip
        run: unzip -q espeak-1.48.15-with-windows.zip -d espeak

      - name: Install tools (MinGW-w64, NSIS)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis

      - name: Compile dictionaries from dictsource
        working-directory: espeak
        run: bash tools/compile-dicts.sh

      - name: Build espeak.dll and espeak-cli.exe
        working-directory: espeak
        run: bash tools/build-windows-dll.sh

      - name: Get the SAPI5 DLLs (if the Windows job succeeded)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: sapi-*
          path: espeak/build-out/sapi
          merge-multiple: true

      - name: Build the installer
        working-directory: espeak
        run: bash tools/build-installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: setup_espeak_1.48.15
          path: espeak/build-out/setup_espeak_1.48.15.exe

      - uses: actions/upload-artifact@v4
        with:
          name: espeak-1.48.15-windows-files
          path: |
            espeak/build-out/espeak-x86_64.dll
            espeak/build-out/espeak-i686.dll
            espeak/build-out/espeak-cli-x86_64.exe
            espeak/build-out/espeak-cli-i686.exe
