# Run this ONCE: it unpacks espeak-1.48.15-with-windows.zip (uploaded to the repository root) and
# commits the extracted files, so the repository then looks like a normal source project.
# Put this file in the repository as .github/workflows/unpack.yml, then Actions -> Unpack -> Run workflow.
name: Unpack the source zip (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack and commit
        run: |
          set -euo pipefail
          ZIP=espeak-1.48.15-with-windows.zip
          test -f "$ZIP" || { echo "::error::$ZIP was not found in the repository root"; exit 1; }
          # the workflow files are not extracted: a workflow may not update .github/workflows
          unzip -q -o "$ZIP" -x '.github/*'
          rm "$ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack the eSpeak 1.48.15 source tree and the Windows build kit"
          git push
          echo "Done: $(git ls-files | wc -l) files are now in the repository."
